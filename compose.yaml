name: deep-eye

services:
  deep-eye:
    build:
      context: .
      target: ${DEEP_EYE_DOCKER_TARGET:-runtime}
      args:
        PYTHON_VERSION: ${DEEP_EYE_PYTHON_VERSION:-3.11}
    image: ${DEEP_EYE_IMAGE:-deep-eye:local}
    init: true
    read_only: true
    user: "10001:10001"
    working_dir: /app
    command: ["--help"]
    stdin_open: true
    tty: true
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /home/deepeye/.cache:rw,nosuid,nodev,noexec,size=128m,mode=0700,uid=10001,gid=10001
    volumes:
      - type: bind
        source: ./config/config.yaml
        target: /app/config/config.yaml
        read_only: true
      - type: volume
        source: deep-eye-data
        target: /app/data
      - type: volume
        source: deep-eye-logs
        target: /app/logs
      - type: volume
        source: deep-eye-reports
        target: /app/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 15s

volumes:
  deep-eye-data:
  deep-eye-logs:
  deep-eye-reports:
